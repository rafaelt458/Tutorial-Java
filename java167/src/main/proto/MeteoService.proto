syntax = "proto3";
option java_multiple_files = true;
package com.laboratorio.grpc;

message MeteoRequest {
  double latitude = 1;
  double longitude = 2;
}

message TemperatureResponse {
  string time = 1;
  double temperature = 2;
}

message TemperatureListResponse {
  repeated TemperatureResponse temperatures = 1;
}

service MeteoService {
  rpc currentTemperature(MeteoRequest) returns (TemperatureResponse);
  rpc hourlyTemperature(MeteoRequest) returns (TemperatureListResponse);
}
